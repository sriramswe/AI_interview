name: Backend checks

on:
  pull_request:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: interviewai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      MYSQL_URL: mysql+pymysql://root:test-password@127.0.0.1:3306/interviewai_test?charset=utf8mb4
      JWT_SECRET_KEY: backend-ci-secret-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q app.py core services utils auth tests
      - run: python -m unittest discover -s tests -v
